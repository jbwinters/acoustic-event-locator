[tool:pytest]
# pytest configuration for event location detector

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for complete workflows
    slow: Tests that take more than 1 second to run
    audio: Tests that involve audio processing
    plotting: Tests that involve matplotlib plotting
    synthetic: Tests using synthetic/generated data
    
# Minimum version requirements
minversion = 6.0

# Test collection timeout
timeout = 300

# Coverage settings (if pytest-cov is installed)
# addopts = --cov=locate_event --cov-report=html --cov-report=term-missing

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:.*PytestUnraisableExceptionWarning.*